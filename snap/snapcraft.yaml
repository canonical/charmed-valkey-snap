name: charmed-valkey # you probably want to 'snapcraft register <name>'
base: core24 # the base snap is the execution environment for this snap
version: '9.0.1' # just for humans, typically '1.2+git' or '1.3.2'
summary: 'Valkey: open source, in memory datastore as a snap' # 79 char long summary
description: |
  A flexible distributed key-value database that is optimized 
  for caching and other realtime workloads. Valkey is an open 
  source, in memory datastore released under the BSD-3 Clause License.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

apps:
  server:
    command: usr/bin/valkey-server
    daemon: simple
    restart-condition: always
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network
      - network-bind
      - network-observe
      - home
  sentinel:
    command: usr/bin/valkey-sentinel
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind
      - network-observe
      - home

parts:
  valkey:
    plugin: make
    source: https://git.launchpad.net/valkey
    source-type: git
    source-tag: lp-9.0.1
    override-build: |
      mkdir -p ${SNAPCRAFT_PART_INSTALL}/usr
      make BUILD_TLS=yes
      PREFIX=${SNAPCRAFT_PART_INSTALL}/usr make BUILD_TLS=yes install
    build-packages:
      - libssl-dev