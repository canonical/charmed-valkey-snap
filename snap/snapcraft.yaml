name: charmed-valkey
base: core26
build-base: devel # can be removed once 26.04 was released to `stable`
version: "9.0.3"
summary: "Valkey: open source, in memory datastore as a snap" # 79 char long summary
description: |
  A flexible distributed key-value database that is optimized 
  for caching and other realtime workloads. Valkey is an open 
  source, in memory datastore released under the BSD-3 Clause License.

grade: devel # must be 'stable' to release into candidate/stable channels
confinement: strict # use 'strict' once you have the right plugs and slots
platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

apps:
  server:
    command: start_valkey.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    environment:
      LANG: C.UTF-8
    plugs:
      - network
      - network-bind

  cli:
    command: usr/bin/valkey-cli
    plugs:
      - network
      - network-bind

  benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network
      - network-bind

  check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network
      - network-bind
      - network-observe

  check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network
      - network-bind

  sentinel:
    command: start_sentinel.sh
    daemon: simple
    install-mode: disable
    restart-condition: always
    restart-delay: 20s
    plugs:
      - network
      - network-bind
    environment:
      LANG: C.UTF-8

  metrics-exporter:
    daemon: simple
    install-mode: disable
    command: start_redis_exporter.sh
    restart-condition: always
    restart-delay: 5s
    plugs:
      - network
      - network-bind
    environment:
      LANG: C.UTF-8


parts:
  valkey:
    plugin: nil
    stage-packages:
      - valkey-server
      - valkey-sentinel
      - valkey-tools
      - util-linux
    # TODO: remove below when correctly implementing DA025: https://docs.google.com/document/d/1MyT4Wt_-vgPwhwEjC-oeHRdLYrZWaQzFGTwclT7hD1U/edit?tab=t.0
    override-prime: |
      craftctl default
      mkdir -p "$CRAFT_PRIME/etc"
      if [ -f "$CRAFT_PRIME/etc/valkey/valkey.conf" ]; then
        cp "$CRAFT_PRIME/etc/valkey/valkey.conf" "$CRAFT_PRIME/etc/valkey.conf"
      fi
      if [ -f "$CRAFT_PRIME/etc/valkey/sentinel.conf" ]; then
        cp "$CRAFT_PRIME/etc/valkey/sentinel.conf" "$CRAFT_PRIME/etc/sentinel.conf"
      fi

  metrics_exporter:
    plugin: go
    source: https://github.com/canonical/redis_exporter.git
    source-type: git
    source-branch: "v1.83.0"
    build-snaps:
      - go/1.26/stable

  wrapper:
    plugin: dump
    source: snap/local
