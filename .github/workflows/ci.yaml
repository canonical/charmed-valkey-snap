name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  build:
    name: Build snap
    uses: canonical/data-platform-workflows/.github/workflows/build_snap.yaml@v40.0.2

  test:
    name: Test Snap
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4

      # to avoid "cannot install snap base "core26": no snap revision available as specified"
      # can be removed once core26 is stable
      - name: Install dependencies
        run: |
          sudo snap install core26 --edge

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.build.outputs.artifact-prefix }}-*
          merge-multiple: true

      - name: Install snap file
        run: |
          sudo snap install --dangerous charmed-valkey*.snap

      - name: Add ldap-module config
        run: |
          ldap_module="/snap/charmed-valkey/current/usr/lib/libvalkey_ldap.so"
          config_file="/var/snap/charmed-valkey/current/etc/charmed-valkey/valkey.conf"
          echo "loadmodule ${ldap_module}" | sudo tee -a ${config_file}

      - name: Start snap service
        run: |
          sudo snap start charmed-valkey.server
          sleep 5

      - name: Run valkey cli
        run: |
          charmed-valkey.cli info

      - name: Run valkey sentinel
        run: |
          sudo snap start charmed-valkey.sentinel
          sleep 5
      - name: Run valkey sentinel info
        run: |
          charmed-valkey.cli -p 26379 sentinel masters
